<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Inmobi · Conversaciones</title>
<style>
  :root{
    --navy:#12233f; --navy-700:#1b3358; --navy-600:#24406b; --navy-050:#eef2f8;
    --gold:#c9a24b; --ink:#1a2233; --muted:#7d879c; --line:#e8ebf1;
    --bg:#f4f6fa; --card:#ffffff; --bubble-in:#ffffff; --bubble-out:#dce9fb;
    --ok:#1f9d6b; --shadow:0 1px 3px rgba(18,35,63,.06),0 8px 24px rgba(18,35,63,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;overflow:hidden;}
  .app{display:flex;height:100vh;}

  /* SIDEBAR */
  .sidebar{width:380px;min-width:320px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:2;}
  .brand{background:var(--navy);color:#fff;padding:18px 20px;display:flex;align-items:center;gap:12px;}
  .brand-logo{width:38px;height:38px;border-radius:9px;background:linear-gradient(135deg,var(--gold),#b8863a);
    display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 8px rgba(201,162,75,.35);}
  .brand-logo svg{width:22px;height:22px;}
  .brand-text h1{font-size:16px;font-weight:700;letter-spacing:.3px;}
  .brand-text p{font-size:11.5px;opacity:.65;margin-top:1px;}
  .brand-status{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11px;opacity:.75;}
  .dot{width:7px;height:7px;border-radius:50%;background:#6b7688;transition:background .3s;}
  .dot.on{background:#38d39f;box-shadow:0 0 0 3px rgba(56,211,159,.2);}
  #convCount{display:none;}

  .search-box{padding:12px 14px;border-bottom:1px solid var(--line);}
  .search-box input{width:100%;padding:10px 14px 10px 38px;border:1px solid var(--line);border-radius:10px;
    background:var(--navy-050) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" fill="%237d879c" viewBox="0 0 16 16"><path d="M6.5 12a5.5 5.5 0 1 0 0-11 5.5 5.5 0 0 0 0 11Zm4.9-.6 3.3 3.3-.9.9-3.3-3.3z"/></svg>') no-repeat 13px center;
    font-size:14px;color:var(--ink);outline:none;transition:border-color .15s,background .15s;}
  .search-box input:focus{border-color:var(--gold);background-color:#fff;}
  .search-box input::placeholder{color:var(--muted);}

  .conv-list{flex:1;overflow-y:auto;}
  .empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;
    color:var(--muted);text-align:center;padding:40px 30px;gap:12px;font-size:13.5px;line-height:1.5;}
  .empty-state svg{opacity:.25;}

  .conv-item{display:flex;gap:13px;padding:13px 16px;cursor:pointer;border-bottom:1px solid #f4f6fa;transition:background .12s;position:relative;}
  .conv-item:hover{background:#fafbfd;}
  .conv-item.active{background:var(--navy-050);}
  .conv-item.active::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--gold);}
  .avatar{width:46px;height:46px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    font-weight:600;font-size:15px;color:#fff;background:linear-gradient(135deg,var(--navy-600),var(--navy));}
  .conv-info{flex:1;min-width:0;}
  .conv-top-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;}
  .conv-name{font-weight:600;font-size:14.5px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .conv-time{font-size:11px;color:var(--muted);flex-shrink:0;}
  .conv-preview{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px;}
  .conv-badges{display:flex;gap:5px;margin-top:7px;flex-wrap:wrap;}
  .badge{font-size:10px;font-weight:600;padding:2.5px 8px;border-radius:20px;letter-spacing:.2px;}
  .badge.comprador{background:#e7f0ff;color:#2563a8;}
  .badge.vendedor{background:#fdf1e0;color:#b5771a;}
  .badge.lead{background:#e5f7ee;color:var(--ok);}
  .badge.cita{background:#efe9fc;color:#7c4bd6;}
  .badge.asesor{background:#fde8ec;color:#c8324f;}

  /* CHAT */
  .chat-panel{flex:1;display:flex;flex-direction:column;background:var(--bg);position:relative;}
  .chat-panel::before{content:'';position:absolute;inset:0;opacity:.4;pointer-events:none;
    background-image:radial-gradient(var(--line) 1px,transparent 1px);background-size:22px 22px;}
  .chat-panel > *{position:relative;z-index:1;}
  .chat-panel .empty-state .big{width:96px;height:96px;border-radius:26px;background:var(--card);box-shadow:var(--shadow);
    display:flex;align-items:center;justify-content:center;margin-bottom:6px;}
  .chat-panel .empty-state .big svg{width:44px;height:44px;color:var(--navy);opacity:.5;}
  .chat-panel .empty-state h2{font-size:17px;font-weight:600;color:var(--ink);}
  .chat-header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 18px;display:flex;align-items:center;gap:13px;}
  .chat-header .avatar{width:42px;height:42px;font-size:14px;}
  .chat-header-info{flex:1;min-width:0;}
  .chat-header-name{font-weight:600;font-size:15px;}
  .chat-header-sub{font-size:12px;color:var(--muted);margin-top:1px;}
  .back-btn,.info-toggle-btn{background:none;border:none;cursor:pointer;color:var(--muted);width:38px;height:38px;
    border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:22px;transition:background .12s,color .12s;}
  .back-btn:hover,.info-toggle-btn:hover{background:var(--navy-050);color:var(--navy);}
  .back-btn{display:none;}
  .info-toggle-btn{display:none;font-size:17px;}

  .messages{flex:1;overflow-y:auto;padding:22px 7%;display:flex;flex-direction:column;gap:3px;}
  .msg-row{display:flex;margin-bottom:2px;}
  .msg-row.human{justify-content:flex-start;}
  .msg-row.assistant{justify-content:flex-end;}
  .bubble{max-width:70%;padding:9px 13px;font-size:14px;line-height:1.45;white-space:pre-wrap;word-wrap:break-word;
    border-radius:12px;box-shadow:0 1px 1px rgba(18,35,63,.05);}
  .msg-row.human .bubble{background:var(--bubble-in);border-bottom-left-radius:3px;}
  .msg-row.assistant .bubble{background:var(--bubble-out);border-bottom-right-radius:3px;}
  .bubble a{color:#2563a8;word-break:break-all;}

  /* PANEL DATOS */
  .data-panel{width:300px;background:var(--card);border-left:1px solid var(--line);overflow-y:auto;z-index:2;display:none;padding:0;}
  .data-panel.show{display:block;}
  .data-panel h3{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:700;
    padding:16px 20px 10px;margin:0;}
  .data-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 20px;font-size:13px;border-bottom:1px solid #f6f7fa;}
  .data-row .k{color:var(--muted);}
  .data-row .v{font-weight:600;text-align:right;color:var(--ink);}
  .flag-yes{color:var(--ok);font-weight:600;}
  .flag-no{color:var(--muted);}

  ::-webkit-scrollbar{width:9px;height:9px;}
  ::-webkit-scrollbar-thumb{background:#d3d9e4;border-radius:5px;}
  ::-webkit-scrollbar-thumb:hover{background:#c0c8d6;}

  /* RESPONSIVE */
  @media (max-width:1180px){
    .data-panel{position:fixed;top:0;right:0;bottom:0;width:340px;max-width:88%;transform:translateX(100%);
      transition:transform .28s cubic-bezier(.4,0,.2,1);box-shadow:-8px 0 30px rgba(18,35,63,.15);}
    .data-panel.show{display:block;transform:translateX(0);}
    .info-toggle-btn{display:flex;}
  }
  @media (max-width:820px){
    .sidebar{width:100%;min-width:0;}
    .chat-panel{display:none;}
    body.chat-open .sidebar{display:none;}
    body.chat-open .chat-panel{display:flex;}
    .back-btn{display:flex;}
    .messages{padding:18px 5%;}
    .bubble{max-width:82%;}
    .data-panel{width:100%;max-width:100%;}
  }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5 10v9h14v-9"/><path d="M9.5 19v-5h5v5"/></svg>
      </div>
      <div class="brand-text"><h1>Inmobi</h1><p>Panel de conversaciones</p></div>
      <div class="brand-status"><span class="dot" id="dot"></span><span id="status">…</span></div>
      <span id="convCount"></span>
    </div>
    <div class="search-box">
      <input id="searchInput" placeholder="Buscar por nombre o teléfono" oninput="onSearch()" autocomplete="off">
    </div>
    <div class="conv-list" id="convList">
      <div class="empty-state">Conectando…</div>
    </div>
  </aside>

  <main class="chat-panel" id="chatPanel">
    <div class="empty-state">
      <div class="big"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></div>
      <h2>Selecciona una conversación</h2>
      <p>Elige un chat de la lista para ver los mensajes y los datos del cliente.</p>
    </div>
  </main>

  <aside class="data-panel" id="dataPanel"></aside>
</div>

<script>
/* ═══ El webhook va aquí, oculto. Es lo único configurable. ═══ */
const webhookBase = 'https://inmobi.tech/n8n/webhook/chat-inspector';

let conversations = [];
let currentPhone = null;

// Auto-conectar al abrir (misma lógica del HTML que funciona)
window.addEventListener('DOMContentLoaded', () => { cargarLista(); });

function volverALista(){
  document.body.classList.remove('chat-open');
  currentPhone = null;
  document.getElementById('dataPanel').classList.remove('show');
}
function toggleDataPanel(){ document.getElementById('dataPanel').classList.toggle('show'); }

function setStatus(txt, isError){
  document.getElementById('status').textContent = txt;
  document.getElementById('dot').classList.toggle('on', !isError);
}

async function cargarLista(search){
  try{
    const q = search ? '&search=' + encodeURIComponent(search) : '';
    const res = await fetch(webhookBase + '?action=list' + q);
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    conversations = data.conversations || [];
    renderList();
    setStatus(conversations.length + ' chats');
  }catch(err){
    setStatus('Sin conexión', true);
    document.getElementById('convList').innerHTML =
      '<div class="empty-state"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>No se pudo conectar.<br>Verifica que el workflow esté activo.</div>';
  }
}

function iniciales(nombre){
  if(!nombre || nombre === 'Sin nombre') return '?';
  return nombre.trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
}
function tiempoRelativo(iso){
  if(!iso) return '';
  const d = new Date(iso);
  const diff = (Date.now() - d.getTime()) / 1000;
  if(diff < 60) return 'ahora';
  if(diff < 3600) return Math.floor(diff/60) + 'm';
  if(diff < 86400) return Math.floor(diff/3600) + 'h';
  if(diff < 604800) return Math.floor(diff/86400) + 'd';
  return d.toLocaleDateString('es-EC', {day:'2-digit', month:'2-digit'});
}
function escapeHtml(s){
  return String(s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function linkify(s){ return escapeHtml(s).replace(/(https?:\/\/[^\s]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>'); }

function renderList(){
  const list = document.getElementById('convList');
  if(!conversations.length){
    list.innerHTML = '<div class="empty-state">No hay conversaciones todavía</div>';
    return;
  }
  list.innerHTML = conversations.map(c => {
    const badges = [];
    if(c.intent === 'COMPRADOR') badges.push('<span class="badge comprador">Comprador</span>');
    if(c.intent === 'VENDEDOR') badges.push('<span class="badge vendedor">Vendedor</span>');
    if(c.lead_registered) badges.push('<span class="badge lead">Lead</span>');
    if(c.appointment_created) badges.push('<span class="badge cita">Cita</span>');
    if(c.advisor_notified) badges.push('<span class="badge asesor">Asesor</span>');
    return `
      <div class="conv-item ${c.phone===currentPhone?'active':''}" onclick="abrirChat('${c.phone}')">
        <div class="avatar">${iniciales(c.nombre)}</div>
        <div class="conv-info">
          <div class="conv-top-row">
            <span class="conv-name">${escapeHtml(c.nombre)}</span>
            <span class="conv-time">${tiempoRelativo(c.updated_at)}</span>
          </div>
          <div class="conv-preview">${c.ultimo_role==='assistant'?'✓ ':''}${escapeHtml(c.ultimo_mensaje)}</div>
          <div class="conv-badges">${badges.join('')}</div>
        </div>
      </div>`;
  }).join('');
}

function onSearch(){
  const val = document.getElementById('searchInput').value.trim();
  clearTimeout(window._searchTimer);
  window._searchTimer = setTimeout(() => cargarLista(val), 300);
}

async function abrirChat(phone){
  currentPhone = phone;
  document.body.classList.add('chat-open');
  renderList();
  document.getElementById('chatPanel').innerHTML = '<div class="empty-state" style="height:100%;">Cargando conversación...</div>';
  try{
    const res = await fetch(webhookBase + '?action=detail&phone=' + encodeURIComponent(phone));
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    renderChat(data);
  }catch(err){
    document.getElementById('chatPanel').innerHTML = '<div class="empty-state" style="height:100%;">Error al cargar: ' + escapeHtml(err.message) + '</div>';
  }
}

function renderChat(d){
  const msgsHtml = (d.messages||[]).map(m => `
    <div class="msg-row ${m.role}">
      <div class="bubble">${linkify(m.content)}</div>
    </div>`).join('');

  document.getElementById('chatPanel').innerHTML = `
    <div class="chat-header">
      <button class="back-btn" onclick="volverALista()" aria-label="Volver">‹</button>
      <div class="avatar">${iniciales(d.nombre)}</div>
      <div class="chat-header-info">
        <div class="chat-header-name">${escapeHtml(d.nombre)}</div>
        <div class="chat-header-sub">${escapeHtml(d.phone)} · ${(d.messages||[]).length} mensajes</div>
      </div>
      <button class="info-toggle-btn" onclick="toggleDataPanel()" aria-label="Ver datos">ⓘ</button>
    </div>
    <div class="messages" id="msgsArea">${msgsHtml || '<div class="empty-state">Sin mensajes</div>'}</div>
  `;
  document.getElementById('msgsArea').scrollTop = 999999;
  renderDataPanel(d);
}

function renderDataPanel(d){
  const dp = document.getElementById('dataPanel');
  if (window.innerWidth > 1180) dp.classList.add('show');
  else dp.classList.remove('show');
  const flag = v => v ? '<span class="flag-yes">✓ Sí</span>' : '<span class="flag-no">— No</span>';
  dp.innerHTML = `
    <h3>Datos del cliente</h3>
    <div class="data-row"><span class="k">Tipo cliente</span><span class="v">${d.intent||'—'}</span></div>
    <div class="data-row"><span class="k">Etapa</span><span class="v">${d.etapa||'—'}</span></div>
    <div class="data-row"><span class="k">Tipo propiedad</span><span class="v">${d.tipo_propiedad||'—'}</span></div>
    <div class="data-row"><span class="k">Sector</span><span class="v">${d.sector||'—'}</span></div>
    <div class="data-row"><span class="k">Presupuesto</span><span class="v">${d.budget?('$'+Number(d.budget).toLocaleString('es-EC')):'—'}</span></div>
    <h3 style="margin-top:8px;">Propiedad activa</h3>
    <div class="data-row"><span class="k">ID Odoo</span><span class="v">${d.selected_property_id||'—'}</span></div>
    <div class="data-row"><span class="k">wp_post_id</span><span class="v">${d.selected_wp_post_id||'—'}</span></div>
    <div class="data-row"><span class="k">Título</span><span class="v" style="font-size:12px;">${escapeHtml(d.selected_property_title||'—')}</span></div>
    <h3 style="margin-top:8px;">Seguimiento</h3>
    <div class="data-row"><span class="k">Lead registrado</span>${flag(d.lead_registered)}</div>
    <div class="data-row"><span class="k">Cita agendada</span>${flag(d.appointment_created)}</div>
    <div class="data-row"><span class="k">Asesor notificado</span>${flag(d.advisor_notified)}</div>
    <div class="data-row"><span class="k">Lead ID</span><span class="v">${d.lead_id||'—'}</span></div>
    <div class="data-row"><span class="k">Cita ID</span><span class="v">${d.appointment_id||'—'}</span></div>
  `;
}
</script>
</body>
</html>
