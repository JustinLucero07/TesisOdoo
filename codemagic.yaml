workflows:
  ios-testflight:
    name: Inmobi iOS - TestFlight
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic_api_key_admin
    environment:
      vars:
        BUNDLE_ID: "com.inmobi.inmobiApp"
        # Apple ID numérico de la app "Inmobi" en App Store Connect (no es
        # secreto, es un identificador público) — se usa para preguntarle a
        # Apple cuál fue el último número de build subido.
        APP_APPLE_ID: "6808286610"
      flutter: stable
      xcode: latest
      cocoapods: default
      # Carga aquí las variables del grupo que creaste en Codemagic
      # (Variables ambientales → grupo "ios_secrets"), entre ellas
      # GOOGLE_SERVICE_INFO_PLIST — el contenido base64 del archivo de
      # Firebase, que nunca vive en el repo.
      groups:
        - ios_secrets
    scripts:
      - name: Restaurar GoogleService-Info.plist (Firebase)
        script: |
          echo $GOOGLE_SERVICE_INFO_PLIST | base64 --decode > "$CM_BUILD_DIR/inmobi_app/ios/Runner/GoogleService-Info.plist"

      - name: Obtener paquetes de Flutter
        script: |
          cd inmobi_app
          flutter packages pub get

      - name: Preparar el llavero para firmar el código
        script: keychain initialize

      # Es la primera vez que se compila esta app: todavía no existe
      # certificado de distribución ni perfil de aprovisionamiento en la
      # cuenta de Apple. --create le dice a Codemagic que los genere él
      # mismo con la API Key; en las próximas compilaciones simplemente
      # los reutiliza porque ya van a existir.
      #
      # CERTIFICATE_PRIVATE_KEY_B64 se guardó en base64 (una sola línea)
      # para que pegarla en Codemagic no arruine los saltos de línea del
      # PEM. Se decodifica aquí mismo, en el mismo paso, justo antes de
      # usarla — así la variable con saltos de línea reales nunca tiene
      # que sobrevivir un copy/paste ni pasar de un paso a otro.
      - name: Generar/obtener certificado y perfil de distribución
        script: |
          export CERTIFICATE_PRIVATE_KEY=$(echo $CERTIFICATE_PRIVATE_KEY_B64 | base64 --decode)
          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create

      - name: Agregar el certificado al llavero
        script: keychain add-certificates

      - name: Aplicar la firma al proyecto de Xcode
        script: xcode-project use-profiles

      # Apple rechaza un build con el mismo número que uno ya subido
      # antes ("the bundle version must be higher than the previously
      # uploaded version"). En vez de subirlo a mano en pubspec.yaml antes
      # de cada compilación, se le pregunta a Apple cuál fue el último y
      # se usa el siguiente automáticamente.
      - name: Calcular el próximo número de build
        script: |
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-testflight-build-number "$APP_APPLE_ID")
          NEXT_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          echo "El último build subido fue el $LATEST_BUILD_NUMBER, este va a ser el $NEXT_BUILD_NUMBER"
          echo "BUILD_NUMBER=$NEXT_BUILD_NUMBER" >> $CM_ENV

      - name: Compilar el .ipa
        script: |
          cd inmobi_app
          flutter build ipa --release \
            --build-number=$BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - inmobi_app/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
